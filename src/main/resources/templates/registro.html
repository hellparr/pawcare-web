<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | PawCare</title><link rel="stylesheet" href="/css/pawcare.css"></head><body class="auth-page"><div class="auth-card"><a class="brand center" href="/"><img src="/images/pawcare-logo.png" alt="PawCare"><span>PawCare</span></a><h1>Crear tu cuenta</h1><p>Empieza a organizar la información de tus mascotas.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/registro"><label>Nombre completo<input type="text" name="fullName" minlength="2" required></label><label>Correo electrónico<input type="email" name="email" required></label><label>Contraseña<input type="password" name="password" minlength="8" required><small>Mínimo 8 caracteres.</small></label><button class="btn full" type="submit">Crear cuenta</button></form><p class="muted">¿Ya tienes cuenta? <a href="/login">Ingresar</a></p></div></body></html>
